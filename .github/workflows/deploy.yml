name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/express-chat/package-lock.json

      - name: Install dependencies
        working-directory: frontend/express-chat
        run: npm ci

      - name: Build Angular app
        working-directory: frontend/express-chat
        run: npm run build -- --configuration production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/express-chat/dist/express-chat/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
